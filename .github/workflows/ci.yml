name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Unit + UI smoke tests（不依赖模型）
        run: npm run test:ci
      - name: Package dry-run（确认没有模型/密钥混入）
        run: npm pack --dry-run